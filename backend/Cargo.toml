[package]
name = "ledger_gate"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.34", features = ["serde-with-str"] }
rust_decimal_macros = "1.34"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"

# Database
# Added `migrate` so tests can run migrations at runtime via `sqlx::migrate` if needed.
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate"] }

# Tracing / Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP layer helpers (CORS so the Vite dev server on a different port can call the API)
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
# Required for DB Integration Tests
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["postgres"] }

# Cargo does NOT auto-discover test files nested in subdirectories of `tests/`.
# Each test file must be registered explicitly here (name + path).
[[test]]
name = "test_ingest"
path = "tests/api_smoke/test_ingest.rs"

[[test]]
name = "test_transactions"
path = "tests/api_smoke/test_transactions.rs"

[[test]]
name = "test_upload"
path = "tests/api_smoke/test_upload.rs"

[[test]]
name = "postgres_container_test"
path = "tests/integration/postgres_container_test.rs"

[[test]]
name = "test_db_store"
path = "tests/integration/test_db_store.rs"

[[test]]
name = "test_ws_broadcast"
path = "tests/integration/test_ws_broadcast.rs"

