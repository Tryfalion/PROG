services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  tester:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # In compose mode the test reads DATABASE_URL to connect to the postgres service
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/postgres"
    # Keep container logs visible; it exits when tests finish
    stdin_open: false
    tty: false
